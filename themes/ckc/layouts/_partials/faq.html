<div class="accordion" id="faqAccordion">
  {{ range $index, $item := .Site.Data.faq }}
    {{ $id := string $index }}
    <div class="accordion-item">
      <h2 class="accordion-header" id="heading-{{ $id }}">
        <button class="accordion-button {{ if ne $index 0 }}collapsed{{ end }}" type="button" data-bs-toggle="collapse" data-bs-target="#collapse-{{ $id }}" aria-expanded="{{ if eq $index 0 }}true{{ else }}false{{ end }}" aria-controls="collapse-{{ $id }}">
          {{ $item.question }}
        </button>
      </h2>
      <div id="collapse-{{ $id }}" class="accordion-collapse collapse {{ if eq $index 0 }}show{{ end }}" aria-labelledby="heading-{{ $id }}" data-bs-parent="#faqAccordion">
        <div class="accordion-body">
          {{ $item.answer | markdownify }}
        </div>
      </div>
    </div>
  {{ end }}
</div>
